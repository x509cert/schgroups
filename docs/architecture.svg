<rect x="60" y="366" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="135.0" y="384" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Accept :11443</text>
<text x="135.0" y="404" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#534AB7">IPv4 + IPv6 threads</text>
<rect x="236" y="356" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<rect x="230" y="361" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<rect x="224" y="366" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="299.0" y="384" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Connection threads</text>
<text x="299.0" y="404" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#534AB7">1 per client</text>
<rect x="404" y="366" width="236" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="522.0" y="384" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">TLS 1.3 Group Policy :11443</text>
<text x="522.0" y="404" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">Only MLKEM1024 (pure PQ)</text>
<line x1="212" y1="394" x2="222" y2="394" stroke="#73726C" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="389" y1="394" x2="402" y2="394" stroke="#73726C" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="299" y1="424" x2="299" y2="444" stroke="#73726C" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="446" width="580" height="234" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="80" y="468" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">secur32.dll → Schannel SSP (LSASS)</text>
<text x="80" y="494" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">Startup, once per port: AcquireCredentialsHandleW(…, &amp;SCH_CREDENTIALS, …)</text>
<text x="80" y="518" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">Groups go in: SCH_CREDENTIALS.pTlsParameters → TLS_PARAMETERS</text>
<text x="80" y="536" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">.pDisabledCrypto → CRYPTO_SETTINGS[ ], one entry per disabled group:</text>
<text x="96" y="554" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">eAlgorithmUsage = TlsParametersCngAlgUsageKeyExchange</text>
<text x="96" y="572" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">strCngAlgId = ECDH_P384, curve25519, X25519_MLKEM768, …</text>
<text x="80" y="600" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">Handshake: AcceptSecurityContext, then QueryContextAttributesW</text>
<text x="80" y="620" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">Group read back: SECPKG_ATTR_CIPHER_INFO.dwKeyType (checked by Allows)</text>
<text x="80" y="646" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">Data: EncryptMessage, DecryptMessage</text>
<text x="80" y="664" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">Close: ApplyControlToken, DeleteSecurityContext</text>
<rect x="70" y="506" width="560" height="78" rx="4" fill="none" stroke="#0F6E56" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="70" y="609" width="560" height="22" rx="4" fill="none" stroke="#0F6E56" stroke-width="1" stroke-dasharray="4 3"/>
