<text x="299.0" y="188" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#534AB7">1 per client</text>
<rect x="404" y="150" width="236" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="522.0" y="168" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">TLS 1.3 Group Policy :8443</text>
<text x="522.0" y="188" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">Only SecP384r1_MLKEM1024</text>
<line x1="212" y1="178" x2="222" y2="178" stroke="#73726C" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="389" y1="178" x2="402" y2="178" stroke="#73726C" stroke-width="1.5" marker-end="url(#arrow)"/>
