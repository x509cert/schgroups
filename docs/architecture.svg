<text x="135.0" y="188" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#534AB7">IPv4 + IPv6 threads</text>
<rect x="236" y="140" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<rect x="230" y="145" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
