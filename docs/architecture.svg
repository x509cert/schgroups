<text x="299.0" y="260" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#534AB7">1 per client</text>
<rect x="404" y="222" width="236" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="522.0" y="240" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">TLS 1.3 Group Policy :9443</text>
<text x="522.0" y="260" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">curve25519, P-256, P-384</text>
<line x1="212" y1="250" x2="222" y2="250" stroke="#73726C" stroke-width="1.5" marker-end="url(#arrow)"/>
