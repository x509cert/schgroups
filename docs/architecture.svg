<text x="135.0" y="332" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#534AB7">IPv4 + IPv6 threads</text>
<rect x="236" y="284" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<rect x="230" y="289" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<rect x="224" y="294" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="299.0" y="312" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Connection threads</text>
<text x="299.0" y="332" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#534AB7">1 per client</text>
<rect x="404" y="294" width="236" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="522.0" y="312" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">TLS 1.3 Group Policy :10443</text>
<text x="522.0" y="332" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">OS defaults, all 7 groups</text>
<line x1="212" y1="322" x2="222" y2="322" stroke="#73726C" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="389" y1="322" x2="402" y2="322" stroke="#73726C" stroke-width="1.5" marker-end="url(#arrow)"/>
